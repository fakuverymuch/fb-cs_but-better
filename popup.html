<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NASTROYKI</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
    <h2>FBCS-BB Settings</h2>

    
    <div class="section">
        <h3>Отображение</h3>
        <label><input type="checkbox" id="enableSid"> Показывать SID</label>
        <label><input type="checkbox" id="enableId"> Показывать ID</label>
        <label><input type="checkbox" id="enableFloat"> Показывать Float</label>
        <label><input type="checkbox" id="enableSt"> Показывать StatTrak</label>
    </div>

    <div class="section">
        <h3>SID</h3>
        <label><input type="checkbox" id="sidShowAll"> Показывать все (отключить – только редкие)</label>
        <input type="text" id="rareSids" placeholder="111,222,333" value="">
        <label>
            <input type="checkbox" id="sidRareAnimate"> Анимация редких
        </label>
        <div class="color-row">
            <label>Цвет редких:</label>
            <input type="color" id="sidRareColor" value="#2ecc71">
        </div>
        <div class="color-row">
            <label>Цвет обычных:</label>
            <input type="color" id="sidNormalColor" value="#95a5a6">
        </div>
    </div>

    <div class="section">
        <h3>ID</h3>
        <label><input type="checkbox" id="idShowAll"> Показывать все (отключить – только редкие)</label>
        <label>Порог редких (ID меньше числа):</label>
        <input type="number" id="rareIdsThreshold" value="10000">
        <div class="color-row">
            <label>Цвет редких:</label>
            <input type="color" id="idRareColor" value="#e67e22">
        </div>
        <div class="color-row">
            <label>Цвет обычных:</label>
            <input type="color" id="idNormalColor" value="#9b59b6">
        </div>
        <label>
            <input type="checkbox" id="idRareAnimate"> Анимация редких
        </label>
    </div>

    <div class="section">
        <h3>Float (состояние износа)</h3>
        <label><input type="checkbox" id="floatShowAll"> Показывать все (отключить – ничего)</label>
        <div class="float-colors">
            <label>FN: <input type="color" id="floatFN" value="#4cd964"></label>
            <label>MW: <input type="color" id="floatMW" value="#ff9500"></label>
            <label>FT: <input type="color" id="floatFT" value="#ff3b30"></label>
            <label>WW: <input type="color" id="floatWW" value="#8e8e93"></label>
        </div>
    </div>

    <div class="section">
        <h3>Интерфейс</h3>
        <label><input type="checkbox" id="hideHoverContent"> Скрыть стандартные подсказки (ID/Float/SID)</label>
    </div>
    <button id="saveBtn">Сохранить</button>
    <div id="status"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
